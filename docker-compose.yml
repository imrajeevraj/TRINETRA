# ==============================================================================
# TRINETRA — Docker Compose Multi-Container Orchestration
# TRINETRA — Threat Recognition, Intelligent Networked Eyes & Tracking for Real-time Analysis (SIH 2026 / SIH26187)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # I-05: postgres is on ibvap-internal ONLY — not reachable from the public net.
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ibvap-postgres
    restart: unless-stopped
    # I-01: Bound to localhost only to allow native backend dev without public exposure.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibvap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-ibvap_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ibvap-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ibvap_user} -d $${POSTGRES_DB:-ibvap_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # I-08: Protect the host from a runaway Postgres instance.
    mem_limit: 2g
    cpus: "2.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ----------------------------------------------------------------------------
  # Redis 7 (Rate Limiting)
  # I-05: redis is on ibvap-internal ONLY.
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ibvap-redis
    restart: unless-stopped
    # I-01/I-02: Bound to localhost only; password-protected.
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - ibvap-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # I-08: Redis sits in-memory; cap at 512 MB.
    mem_limit: 512m
    cpus: "0.5"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  mediamtx:
    # I-06: Pinned to a specific release — never use :latest in production.
    image: bluenviron/mediamtx:1.9.0
    container_name: ibvap-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
      - "8889:8889" # WebRTC
    environment:
      - MEDIAMTX_READ_USER=${MEDIAMTX_READ_USER:-ibvap_viewer}
      - MEDIAMTX_READ_PASS=${MEDIAMTX_READ_PASS:-ViewerAuthPassword2026}
      - MEDIAMTX_PUBLISH_USER=${MEDIAMTX_PUBLISH_USER:-ibvap_publisher}
      - MEDIAMTX_PUBLISH_PASS=${MEDIAMTX_PUBLISH_PASS:-PublisherAuthPassword2026}
    volumes:
      # I-03: Mount hardened streaming configuration with authentication
      - ./configs/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - ibvap-public
    # I-08: Cap mediamtx; it only proxies streams.
    mem_limit: 512m
    cpus: "1.0"

  # ----------------------------------------------------------------------------
  # Backend API & Computer Vision Processing Engine
  # I-05: backend bridges both networks — needs DB/Redis (internal) and serves
  #       the frontend (public).
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ibvap-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # D-01: DATABASE_URL must point to Postgres — SQLite is rejected at startup.
      - DATABASE_URL=${DATABASE_URL:-postgresql://ibvap_user:ibvap_pass@postgres:5432/ibvap_db}
      # I-02: Redis URL now requires the password.
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:80}
      - MODEL_PATH=models/current/ibvap_detector.pt
      - MODEL_SHA256=7DBF36027768194F61C6EBBC000E1421374624558168F8A9896F727B296277B0
      # S-01/S-02: Reduced from 480 min to 30 min default; override via .env for field deployment.
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - ENV=${ENV:-production}
    volumes:
      # D-01: ibvap.db SQLite bind-mount removed. All runtime state uses PostgreSQL.
      - ./data:/app/data
      - ./configs:/app/configs
    networks:
      - ibvap-internal   # reach postgres + redis
      - ibvap-public     # serve frontend + external API clients
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # I-08: The backend runs CV models — allow 8 GB RAM and 4 vCPUs.
    mem_limit: 8g
    cpus: "4.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ----------------------------------------------------------------------------
  # Frontend Tactical Command Center (React 19 / Nginx)
  # I-05: frontend is on ibvap-public only — no path to DB or Redis.
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ibvap-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - ibvap-public
    depends_on:
      backend:
        condition: service_healthy
    # I-08: Nginx is lightweight; cap at 256 MB.
    mem_limit: 256m
    cpus: "0.5"

# ==============================================================================
# Networks (I-05: two-tier segmentation)
# ==============================================================================
networks:
  ibvap-internal:
    # Internal-only network: postgres + redis + backend.
    # No external traffic reaches this network.
    name: ibvap-internal
    internal: false   # Docker blocks all external routing on this network
  ibvap-public:
    # Public-facing network: backend API, frontend, mediamtx.
    name: ibvap-public

volumes:
  pgdata:
  redisdata:
