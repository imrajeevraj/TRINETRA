# ==============================================================================
# TRINETRA — Canonical Class Mapping Configuration (dataset_class_mapping.yaml)
# Normalizes heterogeneous Kaggle and external datasets into canonical classes
# ==============================================================================

version: "2.0"

# Target TRINETRA Classes
ground:
  canonical_classes:
    0: "person"
    1: "vehicle"
  mappings:
    # Person variations
    person: 0
    human: 0
    pedestrian: 0
    individual: 0
    people: 0
    soldier: 0
    man: 0
    woman: 0

    # Vehicle variations
    vehicle: 1
    car: 1
    automobile: 1
    truck: 1
    pickup: 1
    bus: 1
    minivan: 1
    van: 1
    suv: 1
    motorcycle: 1
    motorbike: 1
    auto: 1
    jeep: 1
    tank: 1
    tractor: 1

  ignored_or_excluded:
    - "bicycle"
    - "traffic light"
    - "traffic sign"
    - "bench"
    - "chair"
    - "artilary"
    - "missile"
    - "radar"
    - "m. rocket launcher"
    - "dog"
    - "cat"
    - "animal"

airborne:
  canonical_classes:
    0: "drone"
    1: "aircraft"
  mappings:
    # Drone variations
    drone: 0
    uav: 0
    quadcopter: 0
    multirotor: 0
    hexacopter: 0
    octocopter: 0
    drones: 0

    # Aircraft variations
    aircraft: 1
    airplane: 1
    aeroplane: 1
    fixed-wing: 1
    fixed_wing: 1
    fixedwing: 1
    helicopter: 1
    plane: 1
    fighter: 1
    glider: 1

  hard_negatives:
    - "bird"
    - "birds"
    - "cloud"
    - "clouds"
    - "sky"
    - "glare"
    - "pole"
    - "wire"
    - "tree"
    - "building"
