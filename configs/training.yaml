# ==============================================================================
# IBVAP — Model Training Hyperparameters Configuration
# Tailored for High-Speed Perimeter Surveillance & Border Intrusion Detection
# ==============================================================================

version: "1.0"
run_name: "ibvap_yolo11n_v1"

# Base Model & Transfer Learning
model:
  base_architecture: "yolo11n.pt"  # Initialized from official YOLO11n weights
  num_classes: 2
  classes:
    0: "person"
    1: "vehicle"

# Dataset Configuration
dataset:
  config_path: "data/training/datasets/IBVAP-TRAIN-v1.0/data.yaml"
  dataset_version: "IBVAP-TRAIN-v1.0"

# Training Hardware & Parameters
training:
  epochs: 10
  batch_size: 16
  image_size: 640
  device: "cuda:0"   # Auto-falls back to cpu if CUDA unavailable
  workers: 4
  patience: 10       # Early stopping patience
  save_period: 5
  seed: 42
  deterministic: true

# Optimization
optimizer:
  name: "AdamW"
  learning_rate: 0.002
  lr_final: 0.0001
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 1.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

# Surveillance Domain Augmentations
augmentation:
  hsv_h: 0.015     # Hue variation
  hsv_s: 0.4       # Saturation variation
  hsv_v: 0.4       # Brightness variation (simulates varying sunlight & dusk)
  degrees: 0.0     # Surveillance cameras are static; no dramatic roll
  translate: 0.1   # Camera vibration & panning
  scale: 0.3       # Multi-scale target recognition
  shear: 0.0
  perspective: 0.0001
  flipud: 0.0      # Infiltrators do not appear upside down
  fliplr: 0.5      # Left-to-right horizontal mirroring
  mosaic: 0.5      # Mosaic augmentation for multi-target density
  mixup: 0.0
  copy_paste: 0.0

# Export & Validation Targets
output:
  runs_dir: "data/training/runs"
  export_formats: ["onnx", "engine"]
