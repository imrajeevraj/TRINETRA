name: IBVAP Continuous Integration & Automated Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # S-08: Secret detection runs first — before any build — so leaked credentials
  # never make it into CI artefacts or Docker images.
  secret-scan:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 1. Backend Python & AI Engine Verification
  # ============================================================================
  backend-test:
    name: Backend Tests & AI Verification
    runs-on: ubuntu-latest
    needs: [secret-scan]

    # T-01: Real PostgreSQL with pgvector + Redis service containers for integration testing
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ibvap_user
          POSTGRES_PASSWORD: CiCdTestPostgresPassword123
          POSTGRES_DB: ibvap_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit

      - name: Run Python Security Scan (Bandit)
        run: |
          bandit -r backend/app -ll

      - name: Run Ruff Code Style Check (T-07)
        run: |
          pip install ruff
          ruff format --check backend/app
          ruff check backend/app

      - name: Run Alembic Database Migrations (T-01)
        env:
          DATABASE_URL: "postgresql://ibvap_user:CiCdTestPostgresPassword123@localhost:5432/ibvap_db"
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Pytest Suite (T-01 / T-02)
        env:
          DATABASE_URL: "postgresql://ibvap_user:CiCdTestPostgresPassword123@localhost:5432/ibvap_db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "CiCdTestingSecretKeyMustBe32CharactersMinimumLength12345"
          ADMIN_USERNAME: "ibvap-admin"
          ADMIN_PASSWORD: "TestPassword123"
        run: |
          pytest backend/tests/ -v

      - name: Validate Production Readiness Script (Dry Run)
        run: |
          export DATABASE_URL="postgresql://user:pass@localhost:5432/db"
          export REDIS_URL="redis://localhost:6379/0"
          export JWT_SECRET="secure_test_secret_for_ci_pipeline"
          export ADMIN_PASSWORD="secure_test_password"
          python -m py_compile scripts/check_production_readiness.py

      - name: Run Risk Engine Verification (47 Test Scenarios)
        run: |
          python scripts/verify_risk_engine.py

      - name: Run Computational Geometry & Border Rules Verification
        run: |
          python scripts/verify_border_rules.py

      - name: Run ANPR Multi-Frame Consensus Verification
        run: |
          python scripts/verify_anpr_pipeline.py

  # ============================================================================
  # 2. Frontend React 19 / TypeScript Compilation & Linting
  # ============================================================================
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run NPM Security Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run TypeScript Compilation & Vite Production Build
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # 3. Docker Compose Configuration & Image Validation
  # ============================================================================
  docker-validation:
    name: Dockerfile & Compose Schema Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Images for Trivy Scan (S-11)
        run: |
          docker compose build backend frontend

      - name: Run Trivy Container Vulnerability Scan — Backend (S-11)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ibvap-backend
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy Container Vulnerability Scan — Frontend (S-11)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ibvap-frontend
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
